# /etc/dhcpcd.conf - GT-BE98 mainline OS
# DHCP only on the USB-Ethernet lifeline (eth*/usb*/enx*) and on rnr0 (the
# Runner 10G port on the LAN). Each interface is independent: nothing is
# bridged, so looped ports cannot form a loop and nothing hairpins.
allowinterfaces eth* usb* enx* rnr0
denyinterfaces lo bcawl* wl* br* veth* dummy* tun*

hostname
clientid
persistent
option rapid_commit
option domain_name_servers, domain_name, domain_search, host_name
option classless_static_routes
option interface_mtu
require dhcp_server_identifier
# keep DHCP timeouts short: the lifeline must come up quickly
timeout 30
# IPv6 SLAAC on the same interfaces
slaac private
