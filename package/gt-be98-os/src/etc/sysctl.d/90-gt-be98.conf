# GT-BE98 mainline OS defaults.
# kernel.panic_on_oops=1 and panic=1 come from the forced command line: an
# oops reboots into the committed slot. For a debugging session where the
# box should survive an oops (read dmesg over ssh), run:
#   sysctl -w kernel.panic_on_oops=0
# console loglevel 4 (as the command line's loglevel=4): every console line is
# written synchronously to the UART (~87 us/char), so a chatty console stalls
# the printing thread (the WiFi rx poll lost ~65 ms/s with 7). dmesg keeps all.
# Post-codes are written at KERN_CRIT and still reach the be98pc earlycon.
kernel.printk = 4 4 1 7
kernel.sysrq = 1
kernel.dmesg_restrict = 0
# not a router by default: enable for routing / flow-offload tests
net.ipv4.ip_forward = 0
net.ipv6.conf.all.forwarding = 0
